<!DOCTYPE html>
<html lang="bg-BG">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI BEBE - Магазин</title>
    <meta name="description" content="Скоро тук ще намерите подбрани играчки и помагала за вашето бебе от SI BEBE.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SI BEBE">
    <meta property="og:locale" content="bg_BG">
    <meta property="og:title" content="Магазин | SI BEBE">
    <meta property="og:description" content="Скоро тук ще намерите подбрани играчки и помагала за вашето бебе от SI BEBE.">
    <meta property="og:image" content="https://moral-dev.github.io/sibebe-web/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <script>
        // Second version in the warm palette: ?palette=warm (remembered for this tab), ?palette=default to go back.
        try {
            var palette = new URLSearchParams(location.search).get('palette');
            if (palette) sessionStorage.setItem('sibebe-palette', palette);
            if ((palette || sessionStorage.getItem('sibebe-palette')) === 'warm') document.documentElement.classList.add('palette-warm');
        } catch (e) {}
    </script>
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="page-header hero-playroom">
            <div class="container">
                <h1 data-key="nav.shop">Магазин</h1>
            </div>
        </section>

        <section id="shop-soon">
            <div class="container">
                <div class="split">
                    <figure class="split-media">
                        <img src="../images/hero-bg.webp" alt="Бебе играе с дървена играчка на килима" loading="lazy">
                    </figure>
                    <div class="split-body">
                        <div class="section-title">
                            <h2 data-key="shop.hero_title">В процес на изграждане</h2>
                        </div>
                        <p class="shop-lead" data-key="shop.hero_text">Скоро тук ще намерите подбрани играчки и помагала за вашето бебе.</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="shop-cta" class="band-dark">
            <div class="container cta-band-inner">
                <div>
                    <h2 data-key="home.cta_title">Запишете час онлайн</h2>
                    <p data-key="home.cta_address">гр. Варна, ул. "Братя Миладинови" 68</p>
                    <p data-key="home.cta_hours">Понеделник – Петък (7:30– 18:30) Събота и Неделя 9:00 - 17:00</p>
                </div>
                <div class="hero-actions">
                    <a href="contact.html#booking" class="btn btn-light" data-page-link="contact" data-page-hash="booking" data-key="nav.book_now">Запиши час</a>
                    <a href="contact.html" class="btn btn-outline-light" data-page-link="contact" data-key="contact.directions">Упътване</a>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>
</body>
</html>
