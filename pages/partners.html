<!DOCTYPE html>
<html lang="bg-BG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI BEBE - Партньори</title>
    <meta name="description" content="Медицински, образователни, бранд, медийни и корпоративни партньори на SI BEBE. Станете наш партньор.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SI BEBE">
    <meta property="og:locale" content="bg_BG">
    <meta property="og:title" content="Партньори | SI BEBE">
    <meta property="og:description" content="Медицински, образователни, бранд, медийни и корпоративни партньори на SI BEBE. Станете наш партньор.">
    <meta property="og:image" content="https://moral-dev.github.io/sibebe-web/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700|Montserrat:700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="page-header partners-hero hero-care">
            <div class="container">
                <h1 data-key="partners.hero_title">Заедно предлагаме най-доброто.</h1>
            </div>
        </section>

        <section id="partners">
            <div class="container">
                <div class="split">
                    <figure class="split-media">
                        <img src="../images/vission.webp" alt="Деца играят с дървени играчки в светла занималня" loading="lazy">
                    </figure>
                    <div class="split-body">
                        <div class="section-title">
                            <h2 data-key="partners.title">Партньори</h2>
                        </div>
                        <ul class="icon-list icon-list--compact">
                            <li class="icon-item icon-item--inline">
                                <span class="line-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M12 9v5M9.5 11.5h5"/></svg></span>
                                <h4 data-key="partners.medical">Медицински</h4>
                            </li>
                            <li class="icon-item icon-item--inline">
                                <span class="line-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c3 2 7 2 10 0v-4.5"/></svg></span>
                                <h4 data-key="partners.educational">Образователни</h4>
                            </li>
                            <li class="icon-item icon-item--inline">
                                <span class="line-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg></span>
                                <h4 data-key="partners.brand">Бранд</h4>
                            </li>
                            <li class="icon-item icon-item--inline">
                                <span class="line-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg></span>
                                <h4 data-key="partners.media">Медийни</h4>
                            </li>
                            <li class="icon-item icon-item--inline">
                                <span class="line-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-4h4v4"/></svg></span>
                                <h4 data-key="partners.corporate">Корпоративни</h4>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section id="partner-form-section" class="band-dark">
            <div class="container">
                <div class="partner-form-layout">
                    <div class="partner-form-text">
                        <h2 data-key="partners.form_title">Стани наш партньор</h2>
                        <p data-key="partners.form_text">Вярвате в нашата кауза? Попълнете формата по-долу и нека работим заедно.</p>
                    </div>
                    <div class="card partner-form-card">
                    <form id="partner-form" novalidate class="site-form partner-form">
                        <div class="form-field">
                            <label for="partner-first-name">Име и фамилия <span>*</span></label>
                            <div class="form-row">
                                <input id="partner-first-name" type="text" name="first_name" placeholder="Име" required>
                                <input type="text" name="last_name" placeholder="Фамилия" required>
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="partner-company">Име на компания <span>*</span></label>
                            <input id="partner-company" type="text" name="company" placeholder="Име на компания" required>
                        </div>

                        <div class="form-field">
                            <label for="partner-email">Email <span>*</span></label>
                            <input id="partner-email" type="email" name="email" placeholder="Email" required>
                        </div>

                        <div class="form-field">
                            <label for="partner-phone">Телефон <span>*</span></label>
                            <input id="partner-phone" type="tel" name="phone" placeholder="+359" required>
                        </div>

                        <button type="submit" class="btn">Изпрати</button>
                    </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="../js/main.js"></script>
</body>
</html>
