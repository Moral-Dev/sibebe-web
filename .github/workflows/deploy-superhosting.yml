# Builds the site in site/ and uploads it to SuperHosting (sibebe.bg) on every push to main.
# Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD (an FTP account rooted at public_html).
name: Deploy to SuperHosting

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-superhosting.yml']
  workflow_dispatch:

concurrency:
  group: superhosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pages
        run: python3 site/tools/build.py

      - name: Check FTP settings
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP secrets are not set yet, so nothing was uploaded."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Only changed files are sent. Server-side data is never touched:
      # database settings, admin uploads, photos changed in the admin panel (media/) and the "site hidden" switch.
      - name: Upload to SuperHosting
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            tools/**
            media/**
            uploads/**
            api/config.php
            maintenance.flag
